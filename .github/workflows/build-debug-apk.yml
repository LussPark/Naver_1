name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NaverVideoDownloader/NaverVideoDownloader
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: Gradle 설치 및 캐시
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 로컬 PC 경로가 담긴 local.properties 제거
        run: rm -f local.properties

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --no-daemon

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: NaverVideoDownloader-debug-apk
          path: NaverVideoDownloader/NaverVideoDownloader/app/build/outputs/apk/debug/app-debug.apk
